openapi: 3.0.3
info:
  title: Clique
  description: The OG Monolith behind the global phenomenon known colloquially as "Clique"
  version: 1.0.0
servers:
  - url: 'https'
paths:
  /user/users:
    get:
      tags: [ User ]
      summary: get users
      description: Retrieves all user information for a list of users based on a search term. Else return ErrorResponse object.
      operationId: getUserSearch
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/following/{userId}:
    get:
      tags: [ User ]
      summary: gets a given user's following
      description: Retrieves all user information for a list of users who are following a given user based on a search term. Else return ErrorResponse object.
      operationId: getUserFollowingSearch
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
        - in: query
          name: search
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/followers/{userId}:
    get:
      tags: [ User ]
      summary: gets a given user's followers
      description: Retrieves all user information for a list of users who are followers of a given user based on a search term. Else return ErrorResponse object.
      operationId: getUserFollowersSearch
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
        - in: query
          name: search
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/self:
    get:
      tags: [ User ]
      summary: get user
      description: Retrieves all user information for the USER SIGNED IN,
        returns user information. Else return ErrorResponse object.
      operationId: getUserSelf
      responses:
        '200':
          description: user retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/{userId}:
    get:
      tags: [User]
      summary: get user
      description: Retrieves appropriate user information for the given user depending on
                   relation to user. Else return ErrorResponse object.
      operationId: getUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: user retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/register:
    post:
      tags: [User]
      summary: register
      description: Register a new user given user details. Returns newly created
                   user and auth token on success. Else returns ErrorResponse object
      operationId: registerUser
      requestBody:
        description: Fields required for creating a new user
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestBody"
            example:
              username: "ExampleUsername69"
              password: "pla1nt3xtPa55word"
              phoneNumber: "+16969696969"
              firstName: "Bijan"
              lastName: "Smith"
      responses:
        '200':
          description: register successful, user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/follow:
    post:
      tags: [ User ]
      summary: follow user
      description: Follow/request a given user
      operationId: followUser
      requestBody:
        description: Fields required for following a user
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequestBody"
            example:
              followeeId: "RandomUUID"
      responses:
        '201':
          description: follow successful
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/unfollow:
    post:
      tags: [ User ]
      summary: unfollow user
      description: Unfollow a given user
      operationId: unfollowUser
      requestBody:
        description: Fields required for unfollowing a user
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequestBody"
      responses:
        '204':
          description: unfollow successful
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: follow was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/{userId}/followers:
    get:
      tags: [ User ]
      summary: retrieve followers by user
      description: Returns a list of followers from a given user
      operationId: getFollowersByUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: followers retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/followStatus/{userId}:
    get:
      tags: [ User ]
      summary: retrieve follow status of user
      description: Returns the follow status of the current user and the given user id.
      operationId: getFollowStatus
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: follow status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/followRequests:
    get:
      tags: [ User ]
      summary: retrieve follow requests for the user
      description: Returns a list of follow requests for a given user
      operationId: getFollowRequests
      parameters:
          - in: query
            name: page
            required: true
            schema:
              type: integer
          - in: query
            name: size
            required: true
            schema:
              type: integer
      responses:
        '200':
          description: follow requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFollowRequestsResponse"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/followRequest/{followRequestId}:
    get:
      tags: [ User ]
      summary: accept follow request
      description: Accepts the given follow request if valid.
      operationId: acceptFollowRequest
      parameters:
        - in: path
          name: followRequestId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: follow request accepted successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: follow request was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/followRequest/decline/{followRequestId}:
    get:
      tags: [ User ]
      summary: decline follow request
      description: declines the given follow request if valid.
      operationId: declineFollowRequest
      parameters:
        - in: path
          name: followRequestId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: follow request declined successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: follow request was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/edit:
    patch:
      tags: [ User ]
      summary: edit a given user's data
      description: Edits and returns the updated user if successful
      operationId: editUser
      requestBody:
        description: Optional fields for editing a user
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserRequestBody'
      responses:
        '200':
          description: user edited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponseBody'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/usernameUnique/{username}:
    get:
      tags: [ User ]
      summary: check username unique
      description: Returns true if unique, false if taken
      operationId: checkUsernameUnique
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: username is not taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckUsernameUniqueResponse'
        '400':
          description: username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/phoneNumbers:
    post:
      tags: [ User ]
      summary: retrieve users by phone numbers
      description: Returns a list of users from their phone numbers
      operationId: getUserByPhoneNumbers
      requestBody:
        description: Phone numbers
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetUsersByPhoneNumbersRequestBody'
      responses:
        '200':
          description: users by phone numbers retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/updateDeviceToken:
    patch:
      tags: [ User ]
      summary: replaces the user's device token
      description: Updates a given user's push notification device token
      operationId: updateUserDeviceToken
      requestBody:
        description: token
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceTokenRequestBody'
      responses:
        '200':
          description: token updated successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/block/{userId}:
    get:
      tags: [ User ]
      summary: block a user given a userId
      description: 200 if success, otherwise returns error
      operationId: blockUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: user was blocked successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/unblock/{userId}:
    get:
      tags: [ User ]
      summary: unblock a user given a userId
      description: 200 if success, otherwise returns error
      operationId: unblockUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: user was unblocked successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # Clique endpoints #
  /clique/create:
    post:
      tags: [ Clique ]
      summary: create new clique
      description: Create a new clique given the required fields. Returns clique on success
      operationId: createClique
      requestBody:
        description: Fields required for creating a new clique
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCliqueRequestBody"
      responses:
        '200':
          description: creation successful, clique created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCliqueResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/{cliqueId}:
    get:
      tags: [ Clique ]
      summary: get clique
      description: Retrieves all clique information, user has to be in clique for full info
      operationId: getClique
      parameters:
        - in: path
          name: cliqueId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: clique retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCliqueResponseBody"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/invite:
    post:
      tags: [ Clique ]
      summary: invites a list of users to a clique
      description: Invites a list of users to a clique
      operationId: inviteToClique
      requestBody:
        description: Fields required for inviting users to clique
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToCliqueRequestBody"
      responses:
        '200':
          description: invites successfully sent
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/invites:
    get:
      tags: [ Clique ]
      summary: retrieves a list of a user's clique invites
      description: Gets the list of the user's outstanding clique invites, if any
      operationId: getCliqueInvites
      parameters:
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: invites successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesResponseBody'
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/invite/accept/{cliqueInviteId}:
    get:
      tags: [ Clique ]
      summary: accepts an invite
      description: Accepts an invite to a clique given a clique invite id
      operationId: acceptInvite
      parameters:
        - in: path
          name: cliqueInviteId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: invite successfully accepted
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/invite/decline/{cliqueInviteId}:
    get:
      tags: [ Clique ]
      summary: declines an invite
      description: Declines an invite to a clique given a clique invite id
      operationId: declineInvite
      parameters:
        - in: path
          name: cliqueInviteId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
      responses:
        '200':
          description: invite declined successfully
        '400':
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clique/user/{userId}:
    get:
      tags: [ Clique ]
      summary: get cliques by user
      description: Retrieves cliques for a given user
      operationId: getCliquesByUser
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            minLength: 36
            maxLength: 36
        - in: query
          name: page
          required: true
          schema:
            type: integer
        - in: query
          name: size
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: cliques retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCliquesResponseBody"
